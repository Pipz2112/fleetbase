version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: fleetbase
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "18000:8800"
    depends_on:
      - mysql
      - redis
    environment:
      APP_NAME: Fleetbase
      APP_ENV: local
      APP_KEY:
      APP_DEBUG: "true"
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fleetbase
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
    command: >
      sh -c "
        cp .env.example .env
        composer install &&
        php artisan key:generate &&
        php artisan migrate --force &&
        php artisan serve --host=0.0.0.0 --port=8800
      "


  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - api
    volumes:
      - ./console:/console

volumes:
  mysql_data: